<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hưng Đinh</title>
    <link rel="stylesheet" href="dd_mm_yyyy_09072005.css" />
  </head>
  <body>
    <canvas id="confetti"></canvas>

    <div class="container">
      <div class="profile-card">
        <!-- Ảnh đại diện -->
        <div class="avatar-section">
          <div class="avatar">
            <img
              src="https://res.cloudinary.com/qpuqus9n/image/upload/v1791446491/anhavthung.jpg"
              alt="Hưng Đinh"
            />
          </div>
          <h1 class="name">Đinh Văn Hưng</h1>
          <p class="birthdate">09/07/2005</p>
        </div>

        <!-- Thông tin -->
        <div class="info-section">
          <div class="info-item">
            <div class="info-icon">🎵</div>
            <div class="info-content">
              <h3>Sở thích nghịch</h3>
              <p>Hát (đặc biệt mấy bài của anh J97), Chơi đồ hàng</p>
            </div>
          </div>

          <div class="info-item">
            <div class="info-icon">🍜</div>
            <div class="info-content">
              <h3>Sở thích ăn uống</h3>
              <p>Thích những đồ ăn mà Hưng không không thích :>></p>
            </div>
          </div>
        </div>

        <!-- QR Code liên hệ -->
        <div class="contact-section">
          <h3>
            Alo cho <b><i>Hưng Đinh</i></b> tại đây:
          </h3>
          <div class="qr-code">
            <img
              src="https://res.cloudinary.com/qpuqus9n/image/upload/v1791447330/1791447166877_194549926043811365_3171269915193205140_09470c42f28d0b87c4a29c3f372f1af5.jpg"
              alt="QR Code"
            />
          </div>
          <p class="qr-hint">Quét lẹ mã QR</p>
        </div>

        <!-- Nút quay lại -->
        <button
          class="back-btn"
          onclick="window.location.href = '../index.html'"
        >
          ← Cút, ra ngoài
        </button>
      </div>
    </div>
  </body>
</html>
