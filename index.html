<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday?</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- Trang trí tiệc sinh nhật -->
    <div class="bunting" id="bunting"></div>
    <div class="party-layer" id="partyLayer" aria-hidden="true"></div>

    <button id="settingsBtn">⚙️</button>

    <!-- Menu chọn màu -->
    <div id="colorMenu">
      <h3>Chọn lẹ, có 9 màu thôii</h3>
      <div class="color-options">
        <div
          class="color-option active"
          data-theme="0"
          style="background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)"
        ></div>
        <div
          class="color-option"
          data-theme="1"
          style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)"
        ></div>
        <div
          class="color-option"
          data-theme="2"
          style="background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)"
        ></div>
        <div
          class="color-option"
          data-theme="3"
          style="background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%)"
        ></div>
        <div
          class="color-option"
          data-theme="4"
          style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%)"
        ></div>
        <div
          class="color-option"
          data-theme="5"
          style="background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%)"
        ></div>
        <div
          class="color-option"
          data-theme="6"
          style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)"
        ></div>
        <div
          class="color-option"
          data-theme="7"
          style="background: linear-gradient(135deg, #cfd9df 0%, #e2ebf0 100%)"
        ></div>
        <div
          class="color-option"
          data-theme="8"
          style="background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)"
        ></div>
      </div>
    </div>

    <div class="container">
      <div class="cake">🎂</div>
      <h1>✨ Nổ thử ngày sinh xem là đứa nào coi ✨</h1>
      <p class="subtitle">🎉🎉🎉</p>

      <div class="screen-wrap">
        <div class="screen" id="screen">
          <span class="placeholder">dd/mm/yyyy</span>
        </div>
        <button
          type="button"
          class="cal-btn"
          id="calBtn"
          aria-label="Chọn ngày"
        >
          📅
        </button>
        <input type="date" id="datePicker" class="date-hidden" tabindex="-1" />
      </div>

      <div class="keypad">
        <button class="btn" data-num="1">1</button>
        <button class="btn" data-num="2">2</button>
        <button class="btn" data-num="3">3</button>
        <button class="btn" data-num="4">4</button>
        <button class="btn" data-num="5">5</button>
        <button class="btn" data-num="6">6</button>
        <button class="btn" data-num="7">7</button>
        <button class="btn" data-num="8">8</button>
        <button class="btn" data-num="9">9</button>
        <button class="btn clear" id="clear">⌫</button>
        <button class="btn" data-num="0">0</button>
        <button class="btn enter" id="enter">Chốt</button>
      </div>
    </div>

    <!-- Modal thông báo lỗi -->
    <div id="errorModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>😅 Ai cơ?, gõ cửa nhầm nhà à!</h2>
        <p id="errorMessage">
          <b><i>Hưng Đinh</i> hổng có biết người này!</b>
        </p>
      </div>
    </div>

    <script>
      // Cờ treo
      const bunting = document.getElementById("bunting");
      for (let i = 0; i < 16; i++) {
        bunting.appendChild(document.createElement("span"));
      }

      // Confetti + bóng bay
      const layer = document.getElementById("partyLayer");
      const colors = [
        "#ff6b6b",
        "#feca57",
        "#48dbfb",
        "#ff9ff3",
        "#1dd1a1",
        "#a29bfe",
        "#ffffff",
      ];

      for (let i = 0; i < 40; i++) {
        const c = document.createElement("i");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "%";
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = 6 + Math.random() * 7 + "s";
        c.style.animationDelay = -Math.random() * 10 + "s";
        c.style.width = 6 + Math.random() * 6 + "px";
        c.style.height = 10 + Math.random() * 8 + "px";
        layer.appendChild(c);
      }

      for (let i = 0; i < 7; i++) {
        const b = document.createElement("div");
        b.className = "balloon";
        b.style.left = 5 + i * 14 + Math.random() * 6 + "%";
        b.style.setProperty("--c", colors[i % 6]);
        b.style.animationDuration = 14 + Math.random() * 8 + "s";
        b.style.animationDelay = -Math.random() * 14 + "s";
        layer.appendChild(b);
      }
    </script>

    <script src="index.js"></script>
  </body>
</html>
